modLoader = "javafml"
loaderVersion = "[${loader_version},)"
issueTrackerURL = "${mod_issue_tracker}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "fish_dan, QiuYe, TedXenon"
logoFile = "logo.png"
description = "${mod_description}"
displayURL = "${mod_url}"
enumExtensions = "META-INF/enum_extensions.json"

[[mixins]]
config = "${mod_id}.mixins.json"
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "conditional_mixin"
type = "required"
embedded = true
versionRange = "[${conditional_mixin_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "polymixin"
type = "required"
embedded = true
versionRange = "[${polymixin_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "guideme"
type = "required"
versionRange = "[${guideme_version},)"
ordering = "AFTER"
side = "BOTH"
    [dependencies.${mod_id}.mc-publish]
        ignore = false
        curseforge = "guideme"

[[dependencies.${ mod_id }]]
modId = "ae2"
type = "required"
versionRange = "[${ae2_version},)"
ordering = "AFTER"
side = "BOTH"
    [dependencies.${mod_id}.mc-publish]
        ignore = false
        curseforge = "applied-energistics-2"

