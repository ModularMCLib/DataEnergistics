modLoader = "javafml"
loaderVersion = "[${loader_version},)"
issueTrackerURL = "${mod_issue_tracker}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    authors = "fish_dan, QiuYe, TedXenon"
    logoFile = "logo.png"
    description = "${mod_description}"
    displayURL = "${mod_url}"
    enumExtensions = "META-INF/enum_extensions.json"

[[mixins]]
    config = "${mod_id}.mixins.json"
[[accessTransformers]]
    file = "META-INF/accesstransformer.cfg"

[[dependencies.${ mod_id }]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${ mod_id }]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version}"
    ordering = "NONE"
    side = "BOTH"

# Jar-in-Jar mods.
[[dependencies.${ mod_id }]]
    modId = "conditional_mixin"
    type = "required"
    embedded = true
    versionRange = "[${conditional_mixin_version},)"
    ordering = "AFTER"
    side = "BOTH"
    [dependencies.${mod_id}.mc-publish]
        ignore = true

[[dependencies.${ mod_id }]]
    modId = "polymixin"
    type = "required"
    embedded = true
    versionRange = "[${polymixin_version},)"
    ordering = "AFTER"
    side = "BOTH"
    [dependencies.${mod_id}.mc-publish]
        ignore = false
        curseforge = "polymixin"

[[dependencies.${ mod_id }]]
    modId = "configuration"
    type = "required"
    embedded = true
    versionRange = "[${configuration_version},4)"
    ordering = "AFTER"
    side = "BOTH"
    [dependencies.${mod_id}.mc-publish]
        ignore = false
        curseforge = "configuration"

[[dependencies.${ mod_id }]]
    modId = "mdlib"
    type = "required"
    embedded = true
    versionRange = "[${mdlib_version},)"
    ordering = "NONE"
    side = "BOTH"
    [dependencies.${mod_id}.mc-publish]
        ignore = true

[[dependencies.${ mod_id }]]
    modId = "ctm"
    type = "optional"
    embedded = true
    versionRange = "[${ctm_version},)"
    side = "CLIENT"
    [dependencies.${mod_id}.mc-publish]
        ignore = false
        curseforge = "ctm"

[mc-publish]
    # v3.3.1 needs an explicit NeoForge override to publish an embedded library.
    dependencies = [
        "polymixin@${polymixin_version}(embedded)",
        "configuration@${configuration_version}(embedded)",
        "ctm@${ctm_version}(embedded)",
    ]

# Required external mods.
[[dependencies.${ mod_id }]]
    modId = "guideme"
    type = "required"
    versionRange = "[${guideme_version},)"
    ordering = "AFTER"
    side = "BOTH"
    [dependencies.${mod_id}.mc-publish]
